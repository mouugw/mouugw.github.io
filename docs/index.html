    <style>
        /* 基础色彩变量（适配深浅主题） */
        :root {
            --primary: #0969da; /* 主色：GitHub蓝 */
            --primary-light: #1976d2;
            --primary-dark: #05386b;
            --secondary: #6e7681; /* 辅助色：灰色 */
            --accent: #ff6b6b; /* 强调色：浅红（用于RSS、高亮） */
            --success: #10b981; /* 成功色：绿色 */
            --warning: #f59e0b; /* 警告色：橙色 */
            --bg-primary: #ffffff; /* 浅色背景 */
            --bg-secondary: #f6f8fa; /* 浅色次要背景 */
            --bg-tertiary: #f0f2f5; /* 浅色三级背景 */
            --text-primary: #1f2328; /* 主要文本 */
            --text-secondary: #6e7681; /* 次要文本 */
            --text-tertiary: #949da9; /* tertiary文本 */
            --border-primary: #e1e4e8; /* 主要边框 */
            --border-secondary: #d1d5da; /* 次要边框 */
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 8px rgba(0， 0， 0， 0.06);
            --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.08);
            --radius-sm: 4px;
            --radius: 8px;
            --radius-lg: 12px;
            --transition-fast: 0.2s ease;
            --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* 深色主题变量覆盖 */
        [data-color-mode="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #f0f0f0;
            --text-secondary: #c9d1d9;
            --text-tertiary: #8b949e;
            --border-primary: #30363d;
            --border-secondary: #2a2f36;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
            --shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        /* 全局重置与基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-width: 200px;
            max-width: 900px;
            margin: 30px auto;
            padding: 30px;
            font-size: 16px;
            font-family: -apple-system， BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            line-height: 1.65;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            transition: background-color var(--transition), color var(--transition);
            opacity: 0;
            animation: fade-in 0.6s ease forwards;
        }

        /* 页面渐入效果 */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 链接样式统一 */
        a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition), transform var(--transition);
        }
        a:hover {
            color: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* 按钮样式优化 */
        .btn {
            transition: all var(--transition);
        }
        .btn-invisible {
            color: var(--text-secondary);
            background-color: transparent;
            border: none;
        }
        .btn-invisible:hover {
            color: var(--primary);
            background-color: var(--bg-secondary);
            transform: translateY(-1px);
        }
        .circle {
            border-radius: 50% !important;
        }

        /* 头部样式 */
        #header {
            display: flex;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-primary);
            position: relative;
        }

        /* 头像美化（增加渐变边框） */
        .avatar {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(135deg, var(--primary), var(--accent)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            box-shadow: var(--shadow);
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .avatar:hover {
            transform: scale(1.08) rotate(360deg);
            box-shadow: var(--shadow-md);
        }

        /* 标题样式 */
        #header h1 {
            display: flex;
            align-items: center;
        }
        #header h1 a {
            font-size: 42px;
            font-family: "Monaco", "Menlo", monospace;
            margin-left: 16px;
            font-weight: 700;
            color: var(--text-primary);
            background: linear-gradient(90deg， var(--primary)， var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 头部右侧按钮组 */
        。title-right {
            display: flex;
            margin-left: auto;
            gap: 8px;
        }
        。title-right button,
        。title-right a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
        }
        。title-right svg {
            transition: fill var(--transition), transform var(--transition);
        }
        #buttonSearch svg {
            fill: var(--text-secondary);
        }
        #buttonSearch:hover svg {
            fill: var(--primary);
            transform: scale(1.1);
        }
        #buttonRSS svg {
            fill: var(--accent);
        }
        #buttonRSS:hover svg {
            fill: #ff4757;
            transform: scale(1.1);
        }
        #themeSwitch {
            fill: var(--text-secondary);
        }
        。theme-switch-btn:hover #themeSwitch {
            fill: var(--primary);
            transform: scale(1.1);
        }

        /* 内容区样式 */
        /* 博客描述文本 */
        #content > div:first-child {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.8;
            text-align: center;
            padding: 16px;
            background-color: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }

        /* 文章列表容器 */
        。SideNav {
            min-width: auto;
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition);
        }
        .SideNav:hover {
            box-shadow: var(--shadow);
        }

        /* 文章列表项 */
        .SideNav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-primary);
            transition: all var(--transition);
        }
        .SideNav-item:last-child {
            border-bottom: none;
        }
        .SideNav-item:hover {
            background-color: var(--bg-secondary);
            transform: translateX(0);
            padding-left: 24px; /* hover时左移padding，模拟位移效果 */
        }
        .SideNav-item:hover .SideNav-icon {
            color: var(--primary);
            transform: scale(1.2);
        }

        /* 文章图标 */
        .SideNav-icon {
            margin-right: 16px;
            color: var(--text-tertiary);
            transition: all var(--transition);
        }
        .SideNav-icon octicon {
            width: 20px;
            height: 20px;
        }

        /* 文章标题 */
        .listTitle {
            font-size: 17px;
            font-weight: 500;
            color: var(--text-primary);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            max-width: 100%;
            position: relative;
        }
        .listTitle:hover {
            color: var(--primary);
        }
        /* 长标题hover提示 */
        .listTitle:hover::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 0;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            font-size: 13px;
            white-space: normal;
            width: 280px;
            z-index: 10;
            box-shadow: var(--shadow);
            color: var(--text-primary);
        }

        /* 标签组样式 */
        .listLabels {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .Label {
            padding: 3px 10px;
            border-radius: 16px; /* 胶囊形标签 */
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            transition: all var(--transition-fast);
        }
        .Label:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        /* 标签颜色优化（按分类统一） */
        .LabelName[data-tag="documentation"] {
            background-color: var(--primary);
        }
        .LabelName[data-tag="tech"] {
            background-color: var(--success);
        }
        .LabelName[data-tag="life"] { /* 生活类标签颜色 */
            background-color: var(--warning);
        }
        .LabelTime {
            background-color: var(--text-tertiary) !important;
            color: var(--bg-primary) !important;
        }
        /* 标签内链接样式 */
        .LabelName a {
            color: #fff !important;
            display: inline-block;
        }
        .LabelName a:hover {
            color: #fff !important;
            transform: none;
            text-decoration: underline;
        }

        /* 页脚样式 */
        #footer {
            margin-top: 80px;
            padding-top: 32px;
            border-top: 1px solid var(--border-primary);
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            position: relative;
        }
        /* 页脚装饰线 */
        #footer::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
        }
        #footer1 {
            margin-bottom: 12px;
            font-weight: 500;
            font-size: 15px;
        }
        #footer2 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        #runday {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #runday::before {
            content: "📅";
            font-size: 16px;
        }
        #footer a {
            color: var(--primary);
            font-weight: 500;
        }
        #footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        /* 回到顶部按钮 */
        #backToTop {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all var(--transition);
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        #backToTop:hover {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }
        #backToTop svg {
            width: 24px;
            height: 24px;
            transition: transform var(--transition);
        }
        #backToTop:hover svg {
            transform: translateY(-2px);
        }
        /* 显示时的过渡 */
        #backToTop.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* 骨架屏动画 */
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* 响应式样式 - 平板 */
        @media (max-width: 768px) {
            body {
                padding: 20px;
                margin: 15px auto;
            }

            #header {
                padding-bottom: 16px;
                margin-bottom: 30px;
            }

            .avatar {
                width: 60px;
                height: 60px;
            }

            #header h1 a {
                font-size: 32px;
                margin-left: 12px;
            }

            .title-right {
                gap: 4px;
            }

            .title-right button,
            .title-right a {
                width: 40px;
                height: 40px;
            }

            #content > div:first-child {
                font-size: 16px;
                padding: 12px;
                margin-bottom: 24px;
            }

            .SideNav-item {
                padding: 14px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .SideNav-item:hover {
                padding-left: 18px;
            }

            .listLabels {
                width: 100%;
                justify-content: flex-start;
            }

            #footer {
                margin-top: 60px;
                padding-top: 24px;
            }

            #footer2 {
                gap: 12px;
            }

            #backToTop {
                width: 44px;
                height: 44px;
                bottom: 30px;
                right: 30px;
            }
        }

        /* 响应式样式 - 手机 */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            #header h1 a {
                font-size: 28px;
            }

            .SideNav-item {
                padding: 12px 14px;
            }

            .listTitle {
                font-size: 16px;
            }

            .Label {
                padding: 2px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>

        var utterancesLoad = 0;

        // 主题设置
        let themeSettings = {
            "dark": ["dark","moon","#00f0ff","dark-blue"],
            "light": ["light","sun","#ff5000","github-light"],
            "auto": ["auto","sync","","preferred-color-scheme"]
        };

        // 初始化主题（自动适配系统）
        let theme = localStorage.getItem("meek_theme");
        if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            localStorage。setItem("meek_theme"， theme);
        }
        document。documentElement。setAttribute("data-color-mode"， theme);

        // 切换主题函数
        function changeTheme(mode, icon, color, utheme){
            document。documentElement。setAttribute("data-color-mode"， mode);
            document。getElementById("themeSwitch")。setAttribute("d"， IconList[icon]);
            document。getElementById("themeSwitch")。parentNode。style。color = color;
            if(utterancesLoad == 1){utterancesTheme(utheme);}
        }

        function modeSwitch(){
            let currentMode = document。documentElement。getAttribute('data-color-mode');
            let newMode = currentMode === "light" ? "dark" : currentMode === "dark" ? "auto" : "light";
            localStorage。setItem("meek_theme"， newMode);
            if(themeSettings[newMode]){
                changeTheme(...themeSettings[newMode]);
            }
        }

        function utterancesTheme(theme){
            const message = {type:'set-theme',theme: theme};
            const iframe = document.getElementsByClassName('utterances-frame')[0];
            iframe。contentWindow。postMessage(message，'https://utteranc.es');
        }

        // 应用当前主题
        if(themeSettings[theme]){changeTheme(...themeSettings[theme]);}

        // 初始化图标
        document。getElementById("pathSearch")。setAttribute("d"， IconList["search"]);
        document。getElementById("pathRSS")。setAttribute("d"， IconList["rss"]);
        const iconPost = document。getElementsByClassName("svgTop0");

        // 文章列表图标
        for(var i=0; i<iconPost.length; i++){
            iconPost[i]。setAttribute("d"， IconList["post"]);
        }

        // 回到顶部功能
        const backToTopBtn = document.getElementById("backToTop");
        window。addEventListener("scroll"， () => {
            if (window。scrollY > 300) {
                backToTopBtn。classList。add("show");
            } else {
                backToTopBtn。classList。remove("show");
            }
        });
        backToTopBtn。addEventListener("click"， () => {
            window。scrollTo({ top: 0， behavior: "smooth" });
        });

        // 控制台信息
        console。log("\n %c Gmeek 美化版 - 基于 Meekdai/Gmeek \n","padding:5px 0;background:#0969da;color:#fff");
    </script>
